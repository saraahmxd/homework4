<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Form with Fetch, iFrame, Cookies & LocalStorage</title>

  <style>
    :root {
      --page-bg: #f4f4f9;
      --card-bg: #fff;
      --accent: #007bff;
      --muted: #666;
    }

    html,body {
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: var(--page-bg);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(250,250,255,0.95));
      border-bottom: 1px solid #eee;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    header .welcome {
      font-size: 1.1rem;
      color: #333;
      font-weight: 600;
    }

    header .small {
      color: var(--muted);
      font-size: 0.9rem;
    }

    main {
      max-width: 900px;
      margin: 20px auto;
      padding: 10px 16px 120px;
    }

    .block {
      background-color: var(--card-bg);
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(0,0,0,0.06);
      padding: 20px 30px;
      margin-bottom: 25px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
    }

    .block form {
      display: grid;
      grid-template-columns: 180px 1fr 220px;
      align-items: center;
      row-gap: 12px;
      column-gap: 10px;
    }

    .block label {
      font-weight: bold;
      text-align: right;
    }

    .block input,
    .block select,
    .block textarea {
      width: 100%;
      padding: 6px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .warning {
      color: red;
      font-size: 0.9em;
    }

    fieldset {
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 15px;
      padding: 10px 15px;
      grid-column: 1 / -1;
    }

    fieldset legend {
      font-weight: bold;
    }

    #salary {
      width: 100%;
    }

    #salaryValue {
      font-weight: bold;
      margin-left: 10px;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      margin-top: 10px;
    }

    button:hover {
      background-color: #0056b3;
    }

    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      border-top: 1px solid #e6e6e6;
      padding: 10px 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.03);
    }

    .iframe-wrap {
      height: 220px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #ddd;
    }

    .iframe-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 700px) {
      .block form {
        grid-template-columns: 1fr;
      }
      .block label {
        text-align: left;
      }
      header {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="welcome" id="welcomeText">Hello New user</div>

    <div style="flex:1; max-width:420px;">
      <div class="iframe-wrap">
        <iframe id="headerIframe" src="iframe.html"></iframe>
      </div>
    </div>

    <div id="userControls" class="small" style="min-width:180px; text-align:right;"></div>
  </header>

  <main>
    <div class="block">
      <h1>Application Form</h1>
      <p>This demo uses fetch, iframe, cookies, and localStorage.</p>

      <form id="mainForm">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text"/>
        <div class="warning" id="firstNameWarn"></div>

        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text"/>
        <div class="warning"></div>

        <label for="email">Email</label>
        <input id="email" name="email" type="email"/>
        <div class="warning" id="emailWarn"></div>

        <label for="state">State</label>
        <select id="state" name="state">
          <option value="">Loading states...</option>
        </select>
        <div class="warning" id="stateWarn"></div>

        <label for="salary">Desired salary</label>
        <input type="range" id="salary" name="salary" min="30000" max="200000" step="1000"/>
        <div id="salaryValue">75000</div>

        <label>Conditions</label>
        <div>
          <label><input type="checkbox" name="cond" value="condA" /> A</label><br/>
          <label><input type="checkbox" name="cond" value="condB" /> B</label><br/>
          <label><input type="checkbox" name="cond" value="condC" /> C</label>
        </div>
        <div class="warning"></div>

        <fieldset>
          <legend>Remember me</legend>
          <label for="rememberMe">Remember me (cookie + localStorage)</label>
          <input id="rememberMe" type="checkbox" checked/>
        </fieldset>

        <div style="grid-column:1/-1; display:flex; gap:10px; justify-content:flex-end;">
          <button type="button" id="saveBtn">Save</button>
          <button type="button" id="resetBtn">Reset</button>
        </div>
      </form>
    </div>

    <div class="block">
      <h2>Body iframe</h2>
      <div class="iframe-wrap" style="height:300px;">
        <iframe src="https://example.com"></iframe>
      </div>
    </div>
  </main>

  <footer>
    <div>© Demo Form</div>
  </footer>

  <script>
    /* Utilities */
    function setCookie(name, value, hours) {
      const d = new Date();
      d.setTime(d.getTime() + (hours * 60 * 60 * 1000));
      document.cookie = name + "=" + encodeURIComponent(value) + ";expires=" + d.toUTCString() + ";path=/";
    }

    function getCookie(name) {
      const cookies = document.cookie.split(";").map(c => c.trim());
      for (const c of cookies) {
        if (c.startsWith(name + "=")) return decodeURIComponent(c.split("=")[1]);
      }
      return null;
    }

    function deleteCookie(name) {
      document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    }

    function saveLocal(obj) {
      localStorage.setItem("formData", JSON.stringify(obj));
    }

    function loadLocal() {
      const x = localStorage.getItem("formData");
      return x ? JSON.parse(x) : null;
    }

    function clearLocal() {
      localStorage.removeItem("formData");
    }

    async function loadStates() {
      const sel = document.getElementById("state");
      try {
        const res = await fetch("states.json");
        const states = await res.json();
        sel.innerHTML = '<option value="">Select a state</option>';
        states.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s.code;
          opt.textContent = s.name;
          sel.appendChild(opt);
        });
      } catch {
        sel.innerHTML = '<option value="">Could not load states</option>';
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      await loadStates();

      const firstNameEl = document.getElementById("firstName");
      const lastNameEl = document.getElementById("lastName");
      const emailEl = document.getElementById("email");
      const stateEl = document.getElementById("state");
      const salaryEl = document.getElementById("salary");
      const salaryValue = document.getElementById("salaryValue");
      const rememberMeEl = document.getElementById("rememberMe");
      const saveBtn = document.getElementById("saveBtn");
      const resetBtn = document.getElementById("resetBtn");
      const welcomeText = document.getElementById("welcomeText");
      const userControls = document.getElementById("userControls");

      salaryEl.value = 75000;
      salaryValue.textContent = "75000";
      salaryEl.addEventListener("input", () => salaryValue.textContent = salaryEl.value);

      const cookieName = getCookie("firstName");
      if (cookieName) {
        welcomeText.textContent = "Welcome back, " + cookieName;
      }

      function gather() {
        const conds = [...document.querySelectorAll('input[name="cond"]:checked')].map(x => x.value);
        return {
          firstName: firstNameEl.value,
          lastName: lastNameEl.value,
          email: emailEl.value,
          state: stateEl.value,
          salary: salaryEl.value,
          conditions: conds
        };
      }

      saveBtn.addEventListener("click", () => {
        const data = gather();
        if (rememberMeEl.checked) {
          saveLocal(data);
          setCookie("firstName", data.firstName, 48);
          alert("Saved!");
          welcomeText.textContent = "Welcome back, " + data.firstName;
        } else {
          clearLocal();
          deleteCookie("firstName");
          alert("Saved for this session only.");
        }
      });

      resetBtn.addEventListener("click", () => {
        clearLocal();
        deleteCookie("firstName");
        document.getElementById("mainForm").reset();
        welcomeText.textContent = "Hello New user";
      });
    });
  </script>

</body>
</html>
